# Render.com Blueprint — one-click deploy
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: remotion-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: RENDER_WORKER_SECRET
        sync: false   # paste manually in Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: tts-audio
